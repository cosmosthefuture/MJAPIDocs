info:
  name: list
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/agents/users/all?page=1&per_page=10&search=active"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "10"
      type: query
    - name: search
      value: active
      type: query
      description: can filter with name, ph-no, active, inactive, verifed, unverified
  auth:
    type: bearer
    token: "{{agentAccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

