info:
  name: list
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/admins/games/all?page=1&per_page=10"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "10"
      type: query
    - name: search
      value: coin
      type: query
      description: can filter with name, active, inactive
      disabled: true
  auth:
    type: bearer
    token: "{{adminAccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{baseUrl}}/admins/games/all?page=1&per_page=10"
      method: GET
      headers:
        - name: Content-Type
          value: application/json
      params:
        - name: page
          value: "1"
          type: query
        - name: per_page
          value: "10"
          type: query
        - name: search
          value: coin
          type: query
          description: can filter with name, active, inactive
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: localhost:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.30
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Sat, 21 Mar 2026 04:58:50 GMT
        - name: content-type
          value: application/json
        - name: vary
          value: Origin
      body:
        type: json
        data: |-
          {
            "response": {
              "status": "success",
              "message": "Game Lists"
            },
            "data": [
              {
                "id": 1,
                "name": "Shan Koe Mee",
                "status": "inactive",
                "created_at": "2026-03-21 04:54:00",
                "updated_at": "2026-03-21 04:54:00",
                "deleted_at": null
              },
              {
                "id": 2,
                "name": "Mah Jong",
                "status": "inactive",
                "created_at": "2026-03-21 04:54:00",
                "updated_at": "2026-03-21 04:54:00",
                "deleted_at": null
              }
            ],
            "meta": {
