info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/admins/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "phone_number": "09123456789",
        "password": "password123",
        "fcm_token": "example"
      }

