  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/admins/mah-jong-game-rules/all?page=1&per_page=10"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "10"
      type: query
    - name: search
      value: active
      type: query
      description: can filter with rule_name, active, inactive
      disabled: true
  auth:
    type: bearer
    token: "{{adminAccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

