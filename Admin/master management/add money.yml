info:
  name: add money
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/admins/masters/add-money"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "master_id": 1,
        "amount": "1000"
      }
  auth:
    type: bearer
    token: "{{adminAccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
