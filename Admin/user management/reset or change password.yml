info:
  name: reset or change password
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/admins/users/:id/reset-password"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "3"
      type: path
  body:
    type: json
    data: |-
      {
        "password": "password123456",
        "password_confirmation": "password123456"
      }
  auth:
    type: bearer
    token: "{{adminAccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
