info:
  name: create
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/admins/users"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "User One",
        "email": "userone@example.com", 
        "phone_number": "09111111111",
        "username": "userone123"
      //   "agent_code": "H5690" optional
      }
  auth:
    type: bearer
    token: "{{adminAccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
