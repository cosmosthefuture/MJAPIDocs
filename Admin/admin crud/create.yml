info:
  name: create
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/admins"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "New Admin",
      //   "email": "newadmin@example.com",
        "phone_number": "09111111111",
        "username": "newadmin123",
        "password": "password123",
        "password_confirmation": "password123",
        "permission_type_ids": [1,2]
      }
  auth:
    type: bearer
    token: "{{adminAccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
