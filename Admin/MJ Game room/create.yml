info:
  name: create
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/admins/mah-jong-game-rooms"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "room_name": "Room One",
        "room_code": "0001",
        "game_id": 1,
        "mah_jong_game_rule_id": 1
      }
  auth:
    type: bearer
    token: "{{adminAccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
