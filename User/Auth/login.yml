info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/users/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "phone_number": "09111111111",
        "password": "password123",
        "fcm_token": "example"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
