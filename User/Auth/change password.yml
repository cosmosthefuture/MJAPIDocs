info:
  name: change password
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/users/auth/change-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "current_password": "newpassword1",
        "new_password": "newpassword2",
        "new_password_confirmation": "newpassword2"
      }
  auth:
    type: bearer
    token: "{{userAccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
