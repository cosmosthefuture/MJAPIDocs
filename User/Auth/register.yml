info:
  name: register
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/users/auth/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "phone_number": "09111111111",
        "name": "User One",
        "username": "userone123",
        "email": "userone@example.com",
      //   "agent_code": "AGENT",
      //   "master_code": "MASTER",
        //(only one must be filled:agent or master)
        "password": "password123",
        "password_confirmation": "password123",
        "fcm_token": "example"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
