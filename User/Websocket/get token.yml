info:
  name: get token
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/users/web-socket/token/generate"
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{userAccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{baseUrl}}/users/web-socket/token/generate"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: localhost:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.30
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Thu, 23 Apr 2026 09:49:55 GMT
        - name: content-type
          value: application/json
        - name: vary
          value: Origin
      body:
        type: json
        data: |-
          {
            "response": {
              "status": "success",
              "message": "Jwt token generated successfully."
