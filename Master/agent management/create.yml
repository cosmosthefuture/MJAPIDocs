info:
  name: create
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/masters/agents"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Agent One",
      //   "email": "agentone@example.com",
        "phone_number": "09111111111",
        "username": "agentoneexample123",
        "winning_commission_percentage": 2,
        "agent_code": "NB90JH",
        "password": "password123",
        "password_confirmation": "password123"
      }
  auth:
    type: bearer
    token: "{{masterAccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
