info:
  name: add money
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/masters/agents/add-money"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "agent_id": 1,
        "amount": "500"
      }
  auth:
    type: bearer
    token: "{{masterAccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
