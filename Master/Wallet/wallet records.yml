info:
  name: wallet records
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/masters/wallet-records?page=1&per_page=10"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{masterAccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
