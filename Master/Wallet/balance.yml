info:
  name: balance
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/masters/wallet-balance"
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{masterAccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
